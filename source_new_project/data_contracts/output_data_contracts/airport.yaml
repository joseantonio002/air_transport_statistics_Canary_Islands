dataset: airport
version: "1.0"

source:
  type: csv_file
  path: data/Airport.csv
  update_frequency: monthly
  source_owner: https://joseantonio002.github.io/

schema:
  AirportId:
    type: integer
    nullable: false
  AirportName:
    type: string
    nullable: false
  AirportCode:
    type: string
    nullable: false
  Latitude:
    type: number
    nullable: false
  Longitude:
    type: number
    nullable: false
  CountryCode:
    type: string
    nullable: false
  CountryName:
    type: string
    nullable: false

quality:
  duplicates:
    maximum: 0

  null_percentage:
    AirportId:
      maximum: 0
    AirportName:
      maximum: 0
    AirportCode:
      maximum: 0
    Latitude:
      maximum: 0
    Longitude:
      maximum: 0
    CountryCode:
      maximum: 0
    CountryName:
      maximum: 0

volume:
  monthly:
    minimum_rows: 195
    maximum_rows: 195
    severity: warning

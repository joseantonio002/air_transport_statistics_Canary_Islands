dataset: traffic_per_airport
version: "1.0"

source:
  type: csv_file
  path: data/Final_TrafficPerAirport.csv
  update_frequency: monthly
  source_owner: https://joseantonio002.github.io/

schema:
  BaseAirportId:
    type: integer
    nullable: false
  StopoverAirportId:
    type: integer
    nullable: false
  AircraftMovementId:
    type: integer
    nullable: false
  AirServiceId:
    type: integer
    nullable: false
  Month:
    type: date
    nullable: false
  Passengers:
    type: integer
    nullable: false
  Goods:
    type: integer
    nullable: false
  Mail:
    type: integer
    nullable: false
  Operations:
    type: integer
    nullable: false
  relationships:
    - type: foreignKey
      from: BaseAirportId
      to: airport.AirportId
    - type: foreignKey
      from: StopoverAirportId
      to: airport.AirportId
    - type: foreignKey
      from: AircraftMovementId
      to: aircraft_movement.AircraftMovementId
    - type: foreignKey
      from: AirServiceId
      to: air_service.AirServiceId

quality:
  duplicates:
    maximum: 0

  null_percentage:
    BaseAirportId:
      maximum: 0
    StopoverAirportId:
      maximum: 0
    AircraftMovementId:
      maximum: 0
    AirServiceId:
      maximum: 0
    Month:
      maximum: 0
    Passengers:
      maximum: 0
    Goods:
      maximum: 0
    Mail:
      maximum: 0
    Operations:
      maximum: 0

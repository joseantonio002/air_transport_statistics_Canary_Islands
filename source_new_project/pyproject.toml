[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "istac-air-transport-pipeline"
version = "0.1.0"
description = "ISTAC air transport statistics pipeline"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "requests>=2.32"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-transport-statistics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.3.2",
    "pandas==2.3.3",
    "prophet==1.1.7",
    "cmdstanpy==1.2.5",
    "requests==2.32.4",
    "plotly==6.3.1",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.2",
]

[project.scripts]
air-transport-statistics = "air_transport_statistics.app:main"

[tool.setuptools.packages.find]
where = ["src"]

dataset: traffic_per_territory
version: "1.0"

source:
  type: csv_file
  name: TrafficPerTerritory.csv
  update_frequency: monthly
  source_owner: https://joseantonio002.github.io/

schema:
  IslandId:
    type: integer
    nullable: false
  StopoverTerritoryId:
    type: integer
    nullable: false
  AircraftMovementId:
    type: integer
    nullable: false
  AirServiceId:
    type: integer
    nullable: false
  MonthId:
    type: integer
    nullable: false
  Passengers:
    type: bigint
    nullable: false
  Goods:
    type: bigint
    nullable: false
  Mail:
    type: bigint
    nullable: false
  Operations:
    type: bigint
    nullable: false
  relationships:
    - type: foreignKey
      from: IslandId
      to: territory.TerritoryId
    - type: foreignKey
      from: StopoverTerritoryId
      to: territory.TerritoryId
    - type: foreignKey
      from: AircraftMovementId
      to: aircraft_movement.AircraftMovementId
    - type: foreignKey
      from: AirServiceId
      to: air_service.AirServiceId
    - type: foreignKey
      from: MonthId
      to: calendar_month.MonthId

quality:
  natural_key:
    - IslandId
    - StopoverTerritoryId
    - AircraftMovementId
    - AirServiceId
    - MonthId
  duplicates:
    maximum: 0

  null_percentage:
    IslandId:
      maximum: 0
    StopoverTerritoryId:
      maximum: 0
    AircraftMovementId:
      maximum: 0
    AirServiceId:
      maximum: 0
    MonthId:
      maximum: 0
    Passengers:
      maximum: 0
    Goods:
      maximum: 0
    Mail:
      maximum: 0
    Operations:
      maximum: 0

volume:
  monthly:
    minimum_rows: 480
    maximum_rows: 480

dataset: calendar_month
version: "1.0"

source:
  type: csv_file
  name: CalendarMonth.csv
  update_frequency: one_time
  source_owner: https://joseantonio002.github.io/

schema:
  MonthId:
    type: integer
    nullable: false
  MonthStartDate:
    type: date
    nullable: false
  MonthNumber:
    type: integer
    nullable: false
  MonthName:
    type: string
    nullable: false
  QuarterNumber:
    type: integer
    nullable: false
  QuarterName:
    type: string
    nullable: false
  Year:
    type: integer
    nullable: false
  YearMonth:
    type: string
    nullable: false

quality:
  duplicates:
    maximum: 0

  null_percentage:
    MonthId:
      maximum: 0
    MonthStartDate:
      maximum: 0
    MonthNumber:
      maximum: 0
    MonthName:
      maximum: 0
    QuarterNumber:
      maximum: 0
    QuarterName:
      maximum: 0
    Year:
      maximum: 0
    YearMonth:
      maximum: 0

# From 2004 to 2100, 96 years, 1152 months
volume:
  one_time:
    minimum_rows: 1152
    maximum_rows: 1152
    severity: warning
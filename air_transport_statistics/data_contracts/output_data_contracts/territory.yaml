dataset: territory
version: "1.0"

source:
  type: csv_file
  name: Territory.csv
  update_frequency: one_time
  source_owner: https://joseantonio002.github.io/

schema:
  TerritoryId:
    type: integer
    nullable: false
  TerritoryCode:
    type: string
    nullable: false
  TerritoryName:
    type: string
    nullable: false

quality:
  duplicates:
    maximum: 0

  null_percentage:
    TerritoryId:
      maximum: 0
    TerritoryCode:
      maximum: 0
    TerritoryName:
      maximum: 0

volume:
  one_time:
    minimum_rows: 12
    maximum_rows: 12
    severity: warning
